postgres {
  url      = "jdbc:postgresql://localhost:5432/aviation"
  url      = ${?POSTGRES_URL}
  user     = "aviation"
  user     = ${?POSTGRES_USER}
  password = "aviation"
  password = ${?POSTGRES_PASSWORD}
  max-pool-size = 10
}

kafka {
  bootstrap-servers = "localhost:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
  group-id = "aviation-consumer-group"
}

http {
  port = 8080
  port = ${?HTTP_PORT}
}

jwt {
  # No default value: when JWT_SECRET_KEY is unset, a random secret is generated per process.
  # A value shorter than 32 bytes aborts startup (see JwtConfig.fromEnv).
  secret-key = ${?JWT_SECRET_KEY}
  ttl-seconds = 3600
  ttl-seconds = ${?JWT_TTL_SECONDS}
  issuer = "aero-hex-ai"
  issuer = ${?JWT_ISSUER}
  audience = "aero-hex-ai-api"
  audience = ${?JWT_AUDIENCE}
}
