name: Dependency Updates

on:
  schedule:
    - cron: '0 15 * * 5'  # every Friday  at 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      SBT_OPTS: "-Xmx2g"
      GH_TOKEN: ${{ github.token }}   # for the `gh api` calls in the SBT/scalafmt and Actions steps

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      - name: Report library dependency updates
        run: |
          {
            echo '## Library dependencies'
            echo '```'
            sbt -no-colors xdup
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report SBT plugin updates
        run: |
          {
            echo '## SBT plugins'
            echo '```'
            python3 .claude/skills/bump-versions/scripts/check_plugin_updates.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report SBT / scalafmt formatter versions
        # Not covered by `sbt xdup` (that's the main build's dependencies only) or by Dependabot's
        # "sbt" ecosystem entry, as far as could be confirmed — these two need a direct GitHub
        # releases check, mirroring the bump-versions skill's Step 2 (same `gh api` queries). The
        # SBT one filters to the v1.x line on purpose: sbt/sbt's own /releases/latest now points
        # at 2.x, and CLAUDE.md's versioning policy rules out an SBT 2.x jump without a review.
        run: |
          {
            echo '## SBT itself'
            echo '```'
            echo "current: $(grep sbt.version project/build.properties)"
            echo "latest:  $(gh api 'repos/sbt/sbt/releases?per_page=30' --jq '[.[] | select(.prerelease | not) | .tag_name | select(startswith("v1."))] | first')"
            echo '```'
            echo '## scalafmt formatter'
            echo '```'
            echo "current: $(grep '^version' .scalafmt.conf)"
            echo "latest:  $(gh api repos/scalameta/scalafmt/releases/latest --jq .tag_name)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report GitHub Actions updates
        run: |
          {
            echo '## GitHub Actions'
            echo '```'
            python3 .claude/skills/bump-versions/scripts/check_actions_updates.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
