name: Scala CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**.puml'
      - '**.graphml'
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: 'Also run the integration-tests module (opt-in, real Postgres via Testcontainers)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SBT_OPTS: "-Xmx3g"

jobs:
  build:

    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      - name: Cache incremental compilation state
        # setup-build-env's actions/setup-java (cache: sbt) already caches resolved
        # dependencies (~/.ivy2, ~/.sbt, the Coursier cache) keyed on build.sbt/plugins.sbt — this
        # is the separate, much larger win: zinc's per-module target/ analysis, so an unchanged
        # module across commits doesn't recompile from scratch. Keyed on the commit so each run
        # saves its own state; restore-keys falls back to the most recent match (main branch's
        # cache on a fresh PR branch, or the previous commit otherwise) so zinc only has to
        # recompile what actually changed. A stale/bad cache can't silently ship a wrong result:
        # the `assembly` job builds the shipped jar from its own coverage-free cache, never this one.
        # The `cov` segment keeps this key's restore prefix from matching that job's `nocov` keys.
        uses: actions/cache@v6
        with:
          path: |
            **/target
          key: ${{ runner.os }}-sbt-target-cov-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sbt-target-cov-
      - name: Check formatting, compile, test, and aggregate coverage
        # One sbt invocation: each separate `sbt` call starts a new JVM and reloads the ~11k-setting
        # build (that alone was most of the old 29s "Check formatting" step). coverageAggregate only
        # reads the statement data `test` already wrote to .coverage-data.
        run: sbt scalafmtCheckAll test coverageAggregate

  assembly:
    # Runs in parallel with `build` instead of after it. -Dcoverage=false: coverageEnabled is
    # project-scoped in build.sbt, so a bare `coverageOff` can't turn it off, and without this the
    # shipped jar bundles scoverage's Invoker calls with the runner's absolute .coverage-data path
    # hardcoded into the bytecode. No `clean` is needed: this job's cache only ever holds
    # coverage-free classes, so nothing instrumented can leak in.
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      - name: Cache incremental compilation state (coverage-free)
        uses: actions/cache@v6
        with:
          path: |
            **/target
          key: ${{ runner.os }}-sbt-target-nocov-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sbt-target-nocov-
      - name: Assembly (coverage-free artifact)
        run: sbt -Dcoverage=false "bootstrap/assembly"

  integration-tests:
    # Opt-in only: manually dispatched with the run_integration_tests input checked. Never runs
    # on a plain push/PR, matching the project's convention that integrationTests is excluded from
    # the default sbt test/compile aggregate (see CLAUDE.md's "Integration tests" section) — this
    # just extends that same "explicit invocation only" policy into CI.
    #
    # No postgres `services:` container needed: the integration-tests module spins up its own
    # throwaway Postgres via Testcontainers (see PostgresContainerSupport.scala), and ubuntu-26.04
    # runners already have Docker available for that.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_integration_tests }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      - name: Cache incremental compilation state
        # Same key as the build job's cache above (this job only runs after it, via `needs: build`)
        # — reuses the exact target/ state build already compiled this commit for the shared modules
        # (domain, migration, persistenceQuill), so this job only compiles
        # integrationTests itself instead of the whole dependency chain again.
        uses: actions/cache@v6
        with:
          path: |
            **/target
          key: ${{ runner.os }}-sbt-target-cov-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sbt-target-cov-
      - name: Integration tests (real Postgres via Testcontainers)
        run: sbt integrationTests/test
