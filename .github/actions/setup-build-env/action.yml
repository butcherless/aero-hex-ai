name: Setup build environment
description: Set up JDK 21 + sbt for Scala builds
# Assumes the caller has already run actions/checkout — local composite actions are resolved
# against the checked-out workspace, so checkout can't live inside this action (chicken-and-egg).

runs:
  using: composite
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: sbt
    - name: Setup SBT
      uses: sbt/setup-sbt@v1
      with:
        # Pin the runner to the 1.x line: setup-sbt v1.5.15+ defaults to the sbt 2 runner, and this
        # build stays on sbt 1.x (CLAUDE.md versioning policy). Keep in step with
        # project/build.properties.
        sbt-runner-version: 1.13.1
